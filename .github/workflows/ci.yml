name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dal için yeni bir push gelirse eski çalıştırma iptal edilir
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── API: birim + entegrasyon testleri (gerçek SQL Server) ─────────────
  api-tests:
    name: API testleri
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Testler MERGE, rowversion ve filtreli unique index kullanan kodu sınar:
      # gerçek SQL Server gerekir (SQLite/InMemory yeterli değil).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Sadece bu CI konteynerine ait, dışarı açık olmayan geçici sunucunun şifresi
          MSSQL_SA_PASSWORD: CiOnly_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly_Passw0rd!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # tests/.../PosApiFactory her çalıştırmada bu sunucuda geçici veritabanı açar ve siler
      POS_TEST_SQL: "localhost,1433;User Id=sa;Password=CiOnly_Passw0rd!"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/LCWaikiki.POS.IntegrationTests

      - name: Build
        run: dotnet build tests/LCWaikiki.POS.IntegrationTests --no-restore -c Release

      - name: Test
        run: >
          dotnet test tests/LCWaikiki.POS.IntegrationTests --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  # ── WPF kasa uygulaması: sadece Windows'ta derlenebilir ───────────────
  wpf-build:
    name: Kasa uygulaması (WPF) derleme + test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build tests/LCWaikiki.POS.WpfClient.Tests -c Release

      # Sunucu gerektirmez: ApiClient (oturum yenileme, islem anahtari, ag hatalari),
      # odeme ekrani ve sepet hesaplari sahte HTTP isleyicisiyle sinanir.
      - name: Test
        run: >
          dotnet test tests/LCWaikiki.POS.WpfClient.Tests --no-build -c Release
          --logger "trx;LogFileName=wpf-test-results.trx"
          --results-directory TestResults

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-test-results
          path: TestResults/*.trx

  # ── Angular yönetim / mağaza paneli ───────────────────────────────────
  admin-panel:
    name: Yönetim paneli (Angular) derleme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lcw-pos-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lcw-pos-admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npx ng build

  # ── docker compose duman testi: README'deki "tek komutla demo" gerçekten çalışıyor mu ──
  docker-compose:
    name: Docker compose (SQL Server + API + panel)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build & up
        run: docker compose up -d --build

      - name: API ayağa kalktı mı (migration + demo verisi dahil)
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then echo "API hazır"; exit 0; fi
            sleep 5
          done
          echo "API 7,5 dakikada açılmadı"; exit 1

      - name: Panel ve panel üzerinden giriş (nginx -> API)
        run: |
          curl -fsS http://localhost:4200/ | grep -q "<app-root"
          curl -fsS -X POST http://localhost:4200/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@lcwaikiki.com","password":"Admin123!"}' | grep -q '"token"'
          echo "Panel ve giriş çalışıyor"

      - name: Demo verisi üretildi mi
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login -H "Content-Type: application/json" \
            -d '{"email":"admin@lcwaikiki.com","password":"Admin123!"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          FROM=$(date -d "-30 days" +%F); TO=$(date +%F)
          curl -fsS "http://localhost:8080/api/sales-performance?from=$FROM&to=$TO" -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);n=d['totals']['saleCount'];print('satış:',n);assert n>500"

      - name: Loglar (hata olursa)
        if: failure()
        run: docker compose logs --no-color | tail -200

      - name: Down
        if: always()
        run: docker compose down -v

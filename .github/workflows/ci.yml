name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Aynı dal için yeni bir push gelirse eski çalıştırma iptal edilir
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── API: birim + entegrasyon testleri (gerçek SQL Server) ─────────────
  api-tests:
    name: API testleri
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Testler MERGE, rowversion ve filtreli unique index kullanan kodu sınar:
      # gerçek SQL Server gerekir (SQLite/InMemory yeterli değil).
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Sadece bu CI konteynerine ait, dışarı açık olmayan geçici sunucunun şifresi
          MSSQL_SA_PASSWORD: CiOnly_Passw0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly_Passw0rd!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # tests/.../PosApiFactory her çalıştırmada bu sunucuda geçici veritabanı açar ve siler
      POS_TEST_SQL: "localhost,1433;User Id=sa;Password=CiOnly_Passw0rd!"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/LCWaikiki.POS.IntegrationTests

      - name: Build
        run: dotnet build tests/LCWaikiki.POS.IntegrationTests --no-restore -c Release

      - name: Test
        run: >
          dotnet test tests/LCWaikiki.POS.IntegrationTests --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

  # ── WPF kasa uygulaması: sadece Windows'ta derlenebilir ───────────────
  wpf-build:
    name: Kasa uygulaması (WPF) derleme
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build LCWaikiki.POS.WpfClient/LCWaikiki.POS.WpfClient.csproj -c Release

  # ── Angular yönetim / mağaza paneli ───────────────────────────────────
  admin-panel:
    name: Yönetim paneli (Angular) derleme
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lcw-pos-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lcw-pos-admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npx ng build

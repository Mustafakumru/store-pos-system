# Tek komutla demo: SQL Server + API (demo verisiyle) + panel
#   docker compose up --build
#   Panel:   http://localhost:4200   (admin@lcwaikiki.com / Admin123!)
#   Swagger: http://localhost:8080/swagger
# Kasa uygulaması (WPF, Windows): LCWaikiki.POS.WpfClient/appsettings.json > Api:BaseUrl = http://localhost:8080
#
# YALNIZCA YEREL DEMO: geliştirme ortamı (depodaki geliştirme JWT anahtarı, bilinen demo şifreleri).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LcwPos_Demo_2026!"   # yalnızca bu yerel demo konteyneri için
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LcwPos_Demo_2026!' -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development        # demo verisi + geliştirme hesapları
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=LCWaikikiPOS;User Id=sa;Password=LcwPos_Demo_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  panel:
    build:
      context: lcw-pos-admin
    ports:
      - "4200:80"
    depends_on:
      - api
